<!DOCTYPE html>
<html>
<head>
  <!--
    If you are serving your web app in a path other than the root, change the
    href value below to reflect the base path you are serving from.

    The path provided below has to start and end with a slash "/" in order for
    it to work correctly.

    For more details:
    * https://developer.mozilla.org/en-US/docs/Web/HTML/Element/base

    This is a placeholder for base href that will be replaced by the value of
    the `--base-href` argument provided to `flutter build`.
  -->
  <base href="$FLUTTER_BASE_HREF">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="description" content="Padmashali Vidya Sethu - community education, skills and career platform">

  <!-- iOS meta tags & icons -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="PVS">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">

  <!-- Favicon -->
  <link rel="icon" type="image/png" href="favicon.png"/>

  <title>Padmashali Vidya Sethu</title>
  <link rel="manifest" href="manifest.json">

  <!--
    Loading splash: the splash artwork shown straight away, in the same full-height portrait frame as the app
    (lib/widgets/portrait_frame.dart), while the Flutter engine and app download. flutter_bootstrap.js fades it out
    on Flutter's first frame, when the app's own splash screen takes over.
  -->
  <style>
    html, body { margin: 0; height: 100%; }
    #splash {
      position: fixed; inset: 0; z-index: 10;
      display: flex; justify-content: center;
      background: #E9EEF5;
      transition: opacity 300ms ease-out;
    }
    #splash.done { opacity: 0; pointer-events: none; }
    #splash .frame {
      position: relative; overflow: hidden;
      width: min(100vw, 56.25vh); height: 100vh;
      width: min(100vw, 56.25dvh); height: 100dvh;
      background: #F6EDE2;
      box-shadow: 0 0 24px rgba(0, 0, 0, 0.2);
    }
    #splash img { width: 100%; height: 100%; object-fit: cover; object-position: 50% 80%; }
    #splash .bar { position: absolute; top: 0; left: 0; height: 3px; width: 30%; background: #1C4F9C;
      animation: splash-bar 1.2s ease-in-out infinite; }
    @keyframes splash-bar { from { transform: translateX(-100%); } to { transform: translateX(340%); } }
    @media (prefers-reduced-motion: reduce) { #splash .bar { animation: none; width: 100%; opacity: 0.4; } }
  </style>
</head>
<body>
  <div id="splash" aria-busy="true">
    <div class="frame">
      <img src="assets/assets/images/splash.jpg" alt="Padmashali Vidya Sethu">
      <div class="bar"></div>
    </div>
  </div>
  <script src="flutter_bootstrap.js" async></script>
</body>
</html>
