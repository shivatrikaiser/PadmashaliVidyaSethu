name: padmashali_vidya_setu
description: "Padmashali Vidya Sethu - community education, skills and career platform"
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.11.5

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  cupertino_icons: ^1.0.8
  # Riverpod 3 / go_router 18 require a newer Dart SDK than the one installed; stay on these until upgraded.
  flutter_riverpod: ^2.6.1
  go_router: ^17.5.0
  dio: ^5.11.1
  flutter_secure_storage: ^11.2.0
  intl: ^0.20.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  integration_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.14.4
  flutter_native_splash: ^2.4.6

flutter:
  uses-material-design: true
  # Generates AppLocalizations from lib/l10n/*.arb (see l10n.yaml).
  generate: true
  # Logo, emblem and splash artwork (generated from the masters in branding/).
  assets:
    - assets/images/

# App icon: `dart run flutter_launcher_icons` (re-run after changing branding/).
flutter_launcher_icons:
  android: true
  ios: true
  image_path: branding/pvs_icon_1024.png
  adaptive_icon_background: "#FFFFFF"
  adaptive_icon_foreground: branding/pvs_icon_adaptive_foreground.png
  remove_alpha_ios: true
  min_sdk_android: 21

# Launch screen shown by Android / iOS before Flutter starts: `dart run flutter_native_splash:create`.
# The full splash artwork follows in Flutter (lib/screens/auth/splash_screen.dart).
flutter_native_splash:
  color: "#FFFFFF"
  image: branding/pvs_icon_1024.png
  android_12:
    image: branding/pvs_icon_adaptive_foreground.png
    color: "#FFFFFF"
  web: false
