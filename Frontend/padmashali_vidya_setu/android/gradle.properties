org.gradle.jvmargs=-Xmx8G -XX:MaxMetaspaceSize=4G -XX:ReservedCodeCacheSize=512m -XX:+HeapDumpOnOutOfMemoryError
android.useAndroidX=true
# The project (D:) and the Flutter package cache (C:) are on different drives; Kotlin's incremental
# compilation cache cannot store paths across drives and fails the build. Compile plugins non-incrementally.
kotlin.incremental=false
